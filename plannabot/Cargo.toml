[package]
name = "plannabot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
telluride = { path = ".." }
tokio = { version = "1.8", features = ["fs", "sync", "macros", "rt-multi-thread"] }
log = "0.4"
pretty_env_logger = "0.5"
async-trait = "0.1"

# Google Sheets API (re-exports hyper, hyper_rustls, oauth2)
google-sheets4 = "5"

# HTTP client for Drive API metadata calls (already a transitive dep via teloxide)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization (already a transitive dep)
serde = { version = "1.0", features = ["derive"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# Error handling and utilities
anyhow = "1.0"
serde_json = "1.0"
dotenv = "0.15"

[[bin]]
name = "plannabot"
path = "src/main.rs"
